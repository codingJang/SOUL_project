[project]
name = "soul-project"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.1",
    "gymnasium==0.28.1",
    "jinja2>=3.1.6",
    "matplotlib==3.8.2",
    "networkx>=3.4.2",
    "numpy==1.26.2",
    "optuna>=4.4.0",
    "packaging>=25.0",
    "pandas>=2.3.1",
    "pettingzoo>=1.24.2",
    "plotly>=6.2.0",
    "PySide6",
    "python-multipart>=0.0.20",
    "pyvis>=0.3.2",
    "ray[rllib]==2.8.0",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "setuptools<66",
    "stable-baselines3>=2.3.2",
    "supersuit>=3.9.3",
    "torch==2.1.1",
    "uvicorn[standard]>=0.35.0",
    "websockets>=15.0.1",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
soul-project = { workspace = true }

[dependency-groups]
dev = [
    "soul-project",
]
